[project]
name = "fromthetransistor"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cocotb>=2.1.0",
    "cocotb-test>=0.3.0",
    "isort>=9.0.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   
    "F",   
    "W",   
    "UP",  
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.isort]
profile = "black"
line_length = 88
py_version = 314
